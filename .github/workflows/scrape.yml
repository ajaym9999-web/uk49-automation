name: UK49s Live Scrape ZA

on:
  schedule:
    - cron: '5 11,13,16,18 * * *'  # Brunchtime 11:49 UK, Lunch 12:49, Drive 16:49, Tea 17:49 converted + buffer
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 pytz
      - run: python scrape_za_new.py
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update UK49s results from za.national-lottery.com"
          file_pattern: results.json
